<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Present Perfect Admin
    </title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


<header>

    <a href="./">
        ← Store
    </a>

    <h1>
        Present Perfect Admin
    </h1>

</header>


<main>


<!-- =====================================================
     ADD PRODUCT
===================================================== -->

<section>

    <h2>
        Add Product
    </h2>


    <label>

        Take photo / choose image

        <input
            id="imageFile"
            type="file"
            accept="image/*"
            capture="environment"
        >

    </label>


    <img
        id="preview"
        alt="Product preview"
        hidden
    >


    <label>

        Filename

        <input
            id="filename"
            type="text"
            placeholder="Necklace_799"
            autocomplete="off"
        >

    </label>


    <p class="hint">

        Use:

        <strong>
            Product Name_Price
        </strong>

        <br><br>

        Examples:

        <br>
        Necklace_799

        <br>
        Blue Shirt_599

        <br>
        Cotton Saree_1299

        <br><br>

        The underscore separates the product name
        from the price.

        <br>

        The <strong>.jpg</strong> extension is added automatically.

    </p>


    <button
        id="uploadButton"
        type="button"
    >
        Resize & Upload
    </button>


    <p id="uploadMessage"></p>

</section>



<!-- =====================================================
     EXISTING IMAGES
===================================================== -->

<section>

    <h2>
        Existing Images
    </h2>


    <button
        id="refreshButton"
        type="button"
    >
        Refresh Image List
    </button>


    <div id="imageList"></div>

</section>


</main>


<script src="admin.js"></script>

</body>

</html>
