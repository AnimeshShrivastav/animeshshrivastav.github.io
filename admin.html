<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Present Perfect Admin
    </title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


<header>

    <a href="./">
        ← Store
    </a>

    <h1>
        Present Perfect Admin
    </h1>

</header>



<main>


<section>

    <h2>
        GitHub Connection
    </h2>


    <p class="warning">

        Enter your GitHub Personal Access Token
        only on this page.

        It is not stored by this application.

    </p>


    <label>

        GitHub repository

        <input
            id="repository"
            value="AnimeshShrivastav/animeshrivastav.github.io"
        >

    </label>


    <label>

        GitHub token

        <input
            id="githubToken"
            type="password"
            autocomplete="off"
            placeholder="Paste token here"
        >

    </label>

</section>



<section>

    <h2>
        Upload Product
    </h2>


    <label>

        Take photo / choose image

        <input
            id="imageFile"
            type="file"
            accept="image/*"
            capture="environment"
        >

    </label>


    <img
        id="preview"
        alt="Preview"
        hidden
    >


    <label>

        Filename

        <input
            id="filename"
            placeholder="AJ001_Necklace_MRP799.jpg"
        >

    </label>


    <p class="hint">

        Example:

        AJ001_Necklace_MRP799.jpg

    </p>


    <button
        id="uploadButton"
        type="button"
    >
        Resize & Upload
    </button>


    <p id="uploadMessage"></p>

</section>



<section>

    <h2>
        Existing Images
    </h2>


    <button
        id="refreshButton"
        type="button"
    >
        Refresh Image List
    </button>


    <div id="imageList"></div>

</section>


</main>


<script src="admin.js"></script>

</body>

</html>
